# 통합 설치: installer/install_solution.ps1이 실제 경로로 생성한 mcp.toml을 사용한다.
# 아래는 구조 예시. 기존 scrp/scrp_sandbox 블록을 교체하고 중복 등록하지 않는다.
# solution.py는 Shared·artifact 검사 서비스와 승인 창을 항상 활성화한다.
# 서비스·Defender·Shared 활성화·ExportRoot·실행 금지 ACL 점검 실패 시 시작하지 않는다.
# Shared: 다운로드/SandboxShared/<세션>, artifact_export(TXT): --state 아래 exports.

[mcp_servers.scrp_sandbox]
command = 'C:/Users/<나>/Documents/host_control/.venv/Scripts/python.exe'
args = ['C:/Users/<나>/Documents/host_control/host/solution.py',
        '--runner-exe', 'C:/Users/<나>/Documents/sandbox_runner/build/sandbox_runner.exe',
        '--work', 'C:/Users/<나>/SecureCUA/solution',
        '--state', 'C:/Users/<나>/SecureCUAState/solution']
cwd = 'C:/Users/<나>/Documents/host_control'
enabled = true
default_tools_approval_mode = "approve"
startup_timeout_sec = 60
tool_timeout_sec = 120
